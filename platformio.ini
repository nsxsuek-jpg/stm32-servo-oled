; PlatformIO Project Configuration File
;
; 构建选项 / 上传选项 / 库选项 参见:
; https://docs.platformio.org/page/projectconf.html
;
; ---------------------------------------------------------------------------
; 关于 lib/ 目录（很重要）
;   下面 build_flags 里的 -I lib/... 已经把 SPL 的头文件路径直接塞进了编译参数，
;   于是 PlatformIO 的库依赖扫描(LDF)认为本工程"没有依赖库"，不会把 lib/ 编译成 .a，
;   真正参与链接的标准外设库源文件放在 src/spl/ 下（详见 src/spl/README.md）。
;   要用新的外设驱动（USART/SPI/EXTI/FLASH 等）时，把对应 .c 复制到 src/spl/，
;   并在 include/stm32f10x_conf.h 里加上对应 #include。
;   不要复制 lib/.../system_stm32f10x.c，会和框架的 system_stm32f1xx.c 重复定义。
;
; 关于系统时钟
;   framework = cmsis 提供的 SystemInit() 是空函数，不会配置 PLL，
;   所以不要指望 SYSCLK_FREQ_72MHz 之类宏能生效；
;   72MHz 在 src/main.c 的 SystemClock_Config() 里显式配置。
; ---------------------------------------------------------------------------

[env:genericSTM32F103C8]
platform = ststm32
board = genericSTM32F103C8
framework = cmsis          ; 标准外设库(SPL) + 框架自带启动文件
upload_protocol = stlink
monitor_speed = 115200

build_flags =
    -I include
    -I lib/STM32F10x_StdPeriph_Driver/inc
    -I lib/CMSIS/CM3/CoreSupport
    -I lib/CMSIS/CM3/DeviceSupport/ST/STM32F10x
    -D STM32F10X_MD
    -D USE_STDPERIPH_DRIVER
    -D HSE_VALUE=8000000
    -Wall
    -Wextra
